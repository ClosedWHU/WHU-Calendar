name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7  # nosemgrep: github-actions-mutable-action-tag
      - name: Semgrep scan
        run: |
          HOST_WORK=$(docker inspect "$(cat /etc/hostname)" | jq -r '.[0].Mounts[] | select(.Destination == "/_work") | .Source')
          HOST_PWD="${HOST_WORK}${PWD#/_work}"
          docker run --rm -v "$HOST_PWD:/src" returntocorp/semgrep semgrep scan --config=p/default --metrics=off --error

  build:
    name: Build
    runs-on: [self-hosted, Linux, X64]
    needs: semgrep
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v7  # nosemgrep: github-actions-mutable-action-tag

      - name: Setup pnpm
        uses: pnpm/action-setup@v6  # nosemgrep: github-actions-mutable-action-tag
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7  # nosemgrep: github-actions-mutable-action-tag
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Compile TypeScript
        run: npx tsc

      - name: Generate all ICS files
        run: pnpm run build

      - name: Copy static files
        run: |
          cp index.html dist/
          cp -r assets dist/

      - name: Setup Pages
        uses: actions/configure-pages@v6  # nosemgrep: github-actions-mutable-action-tag

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5  # nosemgrep: github-actions-mutable-action-tag
        with:
          path: './dist'

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [self-hosted, Linux, X64]
    needs: build
    if: github.event_name == 'push'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5  # nosemgrep: github-actions-mutable-action-tag
