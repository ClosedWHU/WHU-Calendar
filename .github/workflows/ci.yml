name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7  # nosemgrep
      - name: Semgrep scan
        run: |
          HOST_WORK=$(docker inspect "$(cat /etc/hostname)" | jq -r '.[0].Mounts[] | select(.Destination == "/_work") | .Source')
          HOST_PWD="${HOST_WORK}${PWD#/_work}"
          docker run --rm -v "$HOST_PWD:/src" returntocorp/semgrep semgrep scan --config=p/default --metrics=off --error

  dart:
    name: Dart package
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7  # nosemgrep
      - uses: dart-lang/setup-dart@v1  # nosemgrep
      - name: Install dependencies
        run: dart pub get
        working-directory: dart
      - name: Verify data sync
        run: |
          dart run tool/sync_data.dart
          if ! git diff --exit-code dart/assets/data/; then
            echo "::error::dart/assets/data/ is out of sync with data/. Run 'dart run tool/sync_data.dart' in dart/ and commit."
            exit 1
          fi
        working-directory: dart
      - name: Analyze
        run: dart analyze
        working-directory: dart

  contributors:
    name: Contributors
    runs-on: [self-hosted, Linux, X64]
    if: github.event_name == 'push'
    permissions:
      contents: write
      pages: none
      id-token: none
    steps:
      - name: Generate Contributors Images
        uses: jaywcjlove/github-action-contributors@main  # nosemgrep
        id: contributors
        with:
          filter-author: (renovate\[bot\]|renovate-bot|dependabot\[bot\])
          avatarSize: 42

      - name: Modify htmlTable README.md
        uses: jaywcjlove/github-action-modify-file-content@main  # nosemgrep
        with:
          message: update contributors[no ci]
          path: README.md
          body: "${{steps.contributors.outputs.htmlList}}"

  build:
    name: Build
    runs-on: [self-hosted, Linux, X64]
    needs: semgrep
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v7  # nosemgrep

      - name: Setup pnpm
        uses: pnpm/action-setup@v6  # nosemgrep
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7  # nosemgrep
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Compile TypeScript
        run: npx tsc

      - name: Generate all ICS files
        run: pnpm run build

      - name: Copy static files
        run: |
          cp index.html dist/
          cp -r assets dist/

      - name: Setup Pages
        uses: actions/configure-pages@v6  # nosemgrep

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5  # nosemgrep
        with:
          path: './dist'

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [self-hosted, Linux, X64]
    needs: build
    if: github.event_name == 'push'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5  # nosemgrep
