name: Semgrep

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7  # nosemgrep: github-actions-mutable-action-tag
      - name: Semgrep scan
        run: |
          HOST_WORK=$(docker inspect "$(cat /etc/hostname)" | jq -r '.[0].Mounts[] | select(.Destination == "/_work") | .Source')
          HOST_PWD="${HOST_WORK}${PWD#/_work}"
          docker run --rm -v "$HOST_PWD:/src" returntocorp/semgrep semgrep scan --config=p/default --metrics=off --error