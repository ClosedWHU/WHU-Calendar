name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  npm:
    name: npm
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7  # nosemgrep

      - name: Install pnpm
        uses: pnpm/action-setup@v6  # nosemgrep
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7  # nosemgrep
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm run build

      - name: Publish to NPM
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ""

  pub-dev:
    name: pub.dev
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      id-token: write
    env:
      FLUTTER_VERSION: "3.47.0"
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    steps:
      - uses: actions/checkout@v7  # nosemgrep

      - name: Setup Dart with OIDC
        uses: dart-lang/setup-dart@v1  # nosemgrep
        with:
          oidc: true

      - name: Setup Flutter from toolcache
        run: |
          TOOLCACHE_DIR="/opt/hostedtoolcache/flutter/stable-${FLUTTER_VERSION}-x64"
          FLUTTER_DIR="${TOOLCACHE_DIR}/flutter"
          if [ ! -x "$FLUTTER_DIR/bin/flutter" ]; then
            echo "Flutter ${FLUTTER_VERSION} not in toolcache, downloading..."
            mkdir -p "$TOOLCACHE_DIR"
            curl -fsSL "${FLUTTER_STORAGE_BASE_URL}/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.x64.zip" -o /tmp/flutter.zip
            unzip -q /tmp/flutter.zip -d "$TOOLCACHE_DIR"
            mv "${TOOLCACHE_DIR}/flutter" "$FLUTTER_DIR"
            rm -f /tmp/flutter.zip
          else
            echo "Flutter ${FLUTTER_VERSION} found in toolcache"
          fi
          echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$FLUTTER_DIR" >> "$GITHUB_ENV"

      - name: Copy root README and LICENSE into package
        run: cp README.md LICENSE dart/

      - name: Publish to pub.dev
        run: flutter pub publish --force
        working-directory: dart
