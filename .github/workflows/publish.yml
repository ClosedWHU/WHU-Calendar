name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  npm:
    name: npm
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7  # nosemgrep

      - name: Install pnpm
        uses: pnpm/action-setup@v6  # nosemgrep
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7  # nosemgrep
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm run build

      - name: Publish to NPM
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ""

  pub-dev:
    name: pub.dev
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7  # nosemgrep

      - name: Setup Dart with OIDC
        uses: dart-lang/setup-dart@v1  # nosemgrep
        with:
          oidc: true

      - name: Copy root README and LICENSE into package
        run: cp README.md LICENSE dart/

      - name: Publish to pub.dev
        run: dart pub publish --force
        working-directory: dart
