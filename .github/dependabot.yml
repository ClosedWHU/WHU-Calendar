version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'Asia/Shanghai'
    open-pull-requests-limit: 1
    groups:
      npm-dependencies:
        patterns:
          - '*'
    cooldown:
      default-days: 7

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:15'
      timezone: 'Asia/Shanghai'
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - '*'
    cooldown:
      default-days: 7
